<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World! — A Little Spark</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f4ff; --muted:#a8b0ce; --violet:#9d7bff; --cyan:#72e7f2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 20% 15%,#273264 0,transparent 36%),radial-gradient(ellipse at 85% 80%,#38235d 0,transparent 35%),#0b1020; }
    body::before, body::after { content:""; position:fixed; width:32rem; height:32rem; border:1px solid #ffffff0d; border-radius:50%; pointer-events:none; }
    body::before { top:-20rem; right:-9rem; box-shadow:0 0 0 4rem #ffffff05,0 0 0 8rem #ffffff03; }
    body::after { bottom:-25rem; left:-14rem; box-shadow:0 0 0 5rem #ffffff04,0 0 0 10rem #ffffff02; }
    .card { width:min(90vw,680px); position:relative; padding:clamp(2.5rem,8vw,5.5rem) clamp(1.7rem,7vw,4.5rem); text-align:center; border:1px solid #ffffff20; border-radius:28px; background:linear-gradient(145deg,#ffffff12,#ffffff05); box-shadow:0 30px 100px #0006,inset 0 1px #ffffff18; backdrop-filter:blur(18px); animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .spark { display:grid; place-items:center; width:58px;height:58px;margin:0 auto 2rem;border-radius:18px;color:#101329;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 8px 35px #9d7bff55; font-size:1.6rem; }
    .eyebrow { margin:0 0 1rem; color:var(--cyan); font-size:.75rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(3rem,10vw,6.2rem); line-height:.98; letter-spacing:-.075em; font-weight:800; }
    h1 span { color:transparent; background:linear-gradient(100deg,#fff 10%,#c7b8ff 55%,#75e7ed); background-clip:text; -webkit-background-clip:text; }
    .description { max-width:390px; margin:1.5rem auto 0; color:var(--muted); font-size:clamp(1rem,2.6vw,1.15rem); line-height:1.75; }
    button { margin-top:2.2rem; padding:.9rem 1.35rem; border:1px solid #ffffff30; border-radius:999px; color:var(--ink); background:#ffffff0c; font:inherit; font-size:.9rem; font-weight:650; cursor:pointer; transition:transform .2s,border-color .2s,background .2s; }
    button:hover { transform:translateY(-2px); border-color:#bba7ff99; background:#ffffff17; }
    button:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
    .note { margin:2rem 0 0; color:#77809f; font-size:.75rem; letter-spacing:.04em; }
    @keyframes rise { from { opacity:0; transform:translateY(18px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="spark" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1><span>Hello,<br>World!</span></h1>
    <p class="description">Every great idea begins somewhere. Here’s to the first line—and everything that comes after.</p>
    <button type="button" id="helloButton">Make a little magic&nbsp; ✨</button>
    <p class="note" id="note" aria-live="polite">Made with curiosity and a little CSS</p>
  </main>
  <script>
    const button = document.querySelector('#helloButton');
    const note = document.querySelector('#note');
    button.addEventListener('click', () => {
      note.textContent = 'You just made the internet a little brighter ✨';
      button.textContent = 'Magic made ✓';
    });
  </script>
</body>
</html>
