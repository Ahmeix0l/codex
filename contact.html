<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Contact Us</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f4ff; --muted:#a8b0ce; --violet:#9d7bff; --cyan:#72e7f2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:6rem 1rem 2rem; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 20% 15%,#273264 0,transparent 36%),radial-gradient(ellipse at 85% 80%,#38235d 0,transparent 35%),#0b1020; }
    body::before, body::after { content:""; position:fixed; width:32rem; height:32rem; border:1px solid #ffffff0d; border-radius:50%; pointer-events:none; }
    body::before { top:-20rem; right:-9rem; box-shadow:0 0 0 4rem #ffffff05,0 0 0 8rem #ffffff03; }
    body::after { bottom:-25rem; left:-14rem; box-shadow:0 0 0 5rem #ffffff04,0 0 0 10rem #ffffff02; }
    .site-nav { position:fixed; z-index:2; top:1.25rem; left:50%; transform:translateX(-50%); display:flex; gap:.35rem; padding:.4rem; border:1px solid #ffffff20; border-radius:999px; background:#11172acc; backdrop-filter:blur(14px); }
    .site-nav a { padding:.65rem 1rem; border-radius:999px; color:var(--muted); font-size:.85rem; text-decoration:none; transition:color .2s,background .2s; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color:var(--ink); background:#ffffff12; }
    .site-nav a:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
    .card { width:min(90vw,680px); position:relative; padding:clamp(2rem,7vw,4.5rem); border:1px solid #ffffff20; border-radius:28px; background:linear-gradient(145deg,#ffffff12,#ffffff05); box-shadow:0 30px 100px #0006,inset 0 1px #ffffff18; backdrop-filter:blur(18px); animation:rise .8s ease both; }
    .spark { display:grid; place-items:center; width:54px;height:54px;margin-bottom:1.8rem;border-radius:17px;color:#101329;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 8px 35px #9d7bff55; font-size:1.5rem; }
    .eyebrow { margin:0 0 1rem; color:var(--cyan); font-size:.75rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.8rem,8vw,5.2rem); line-height:1; letter-spacing:-.07em; font-weight:800; }
    h1 span { color:transparent; background:linear-gradient(100deg,#fff 10%,#c7b8ff 55%,#75e7ed); background-clip:text; -webkit-background-clip:text; }
    .description { max-width:450px; margin:1.5rem 0 2rem; color:var(--muted); font-size:1.05rem; line-height:1.8; }
    label { display:block; margin:1rem 0 .45rem; color:#d8d7f5; font-size:.85rem; font-weight:600; }
    input, textarea { width:100%; padding:.9rem 1rem; border:1px solid #ffffff24; border-radius:12px; color:var(--ink); background:#090e1b88; font:inherit; }
    textarea { min-height:130px; resize:vertical; }
    input:focus, textarea:focus { outline:2px solid #72e7f288; border-color:transparent; }
    button { margin-top:1.3rem; padding:.9rem 1.3rem; border:0; border-radius:999px; color:#101329; background:linear-gradient(100deg,var(--cyan),#c5a8ff); font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--cyan); outline-offset:4px; }
    .hint { margin:1rem 0 0; color:#858eac; font-size:.8rem; line-height:1.6; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:480px) { .site-nav { top:.8rem; } .site-nav a { padding:.6rem .8rem; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main class="card">
    <div class="spark" aria-hidden="true">✉</div>
    <p class="eyebrow">The beginning of a conversation</p>
    <h1><span>Get in<br>touch.</span></h1>
    <p class="description">Have a thought, a question, or an idea you’d like to share? Write a note and let’s start there.</p>
    <form id="contactForm">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" required>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Your message</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Prepare your message&nbsp; →</button>
      <p class="hint" id="formHint" aria-live="polite">This opens your email app with your message ready to send.</p>
    </form>
  </main>
  <script>
    document.querySelector('#contactForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const fields = new FormData(event.currentTarget);
      const subject = `Hello from ${fields.get('name')}`;
      const body = `${fields.get('message')}\n\nFrom: ${fields.get('name')} (${fields.get('email')})`;
      document.querySelector('#formHint').textContent = 'Your email app should open with the message filled in.';
      window.location.href = `mailto:hello@example.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>
</body>
</html>
